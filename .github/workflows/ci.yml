name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'sqlc.yaml'
      - 'migrations/**'
      - 'internal/database/query/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opname
          POSTGRES_PASSWORD: opname
          POSTGRES_DB: opname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opname -d opname"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://opname:opname@localhost:5432/opname?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.1

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Validate migrations
        run: goose -dir migrations postgres "$DATABASE_URL" validate

      - name: Apply migrations
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Validate migration rollback
        run: |
          goose -dir migrations postgres "$DATABASE_URL" down-to 0
          goose -dir migrations postgres "$DATABASE_URL" up

      - name: Generate sqlc code
        run: sqlc generate

      - name: Run tests
        run: go test ./...

      - name: Build all packages
        run: go build ./...

      - name: Commit regenerated sqlc code
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- internal/database/generated)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/database/generated
            git commit -m "chore: regenerate sqlc"
            git push
          else
            echo "sqlc generated code is already in sync"
          fi
